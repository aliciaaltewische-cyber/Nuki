<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nooks</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nooks">
<meta name="theme-color" content="#f6f5f1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, hochwertig, zurückhaltend, Reise-App statt Spielzeug
   IDEA: ein stilles Reisejournal für Mensch und Hund; jeder Ort ist ein Bild mit klarer Regel
   PICTURE: erdige Landschaftsszenen oder eigene Fotos, Glas-Panels; gezeichnete Karte Südbayerns
   COLOUR and TYPE: Off-White #f6f5f1, Tinte #121210, Oliv/Erdtöne, gedämpfte Ampel; Inter 300 bis 500
   LAYOUT: App-Rahmen max. 440px, Pill-Tabs, große Bildkarten, schwebende Leiste, Bottom-Sheets */
:root{color-scheme:light dark;--bg:light-dark(#f6f5f1,#11110e);--card:light-dark(#fff,#1b1b17);--soft:light-dark(#eeece6,#23231e);--ink:light-dark(#121210,#f1efe8);--mut:light-dark(#86837b,#9a978d);--line:light-dark(#e4e1d9,#2d2d27);--ok:#6f8f5e;--mid:#c49a4a;--no:#b4614c;--paw:light-dark(rgba(18,18,16,.07),rgba(241,239,232,.07));--land:light-dark(#ebe8df,#1c1c17);--land2:light-dark(#e2ded2,#24241d);--lake:light-dark(#c9d3d0,#2a3634);--alp1:light-dark(#d6d4c2,#2a2b23);--alp2:light-dark(#bdbca5,#34352c);--alp3:light-dark(#a3a38b,#3f4035);--forest:light-dark(#dfe2cf,#20241b);--road:light-dark(#d8d2c2,#3a382f);--city:light-dark(#e4ded0,#262520);--river:light-dark(#b4c6c8,#2f4446);--border:light-dark(#b9b1a0,#4a463b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}b{font-weight:500}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding-top:env(safe-area-inset-top)}
/* Pfoten im Hintergrund */
#paws{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#paws span{position:absolute;width:var(--s);height:var(--s);opacity:var(--o);animation:drift var(--d) ease-in-out var(--dl) infinite alternate;will-change:transform}
#paws svg{width:100%;height:100%;fill:var(--ink)}
@keyframes drift{0%{transform:translate(0,0) rotate(var(--r))}50%{transform:translate(calc(var(--dx)*.6),calc(var(--dy)*-.4)) rotate(calc(var(--r) + 12deg))}100%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--r) - 10deg))}}
/* Splash */
.mark{position:absolute!important;top:44px;left:50%;transform:translateX(-50%);width:40px;height:40px;opacity:.9}
.splash{position:relative;min-height:100vh;color:#f1efe8;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 28px calc(48px + env(safe-area-inset-bottom));text-align:center;overflow:hidden}
.splash>svg.sc{position:absolute;inset:0;width:100%;height:100%}
.splash::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,14,0) 30%,rgba(17,17,14,.85) 78%)}
.splash>*:not(svg){position:relative;z-index:1}
.splash .logo{width:min(62%,260px);margin:0 auto 34px;display:block}
.hlogo{height:30px;width:auto;display:block;margin:2px 0 16px}
.lg-w{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lg-b{display:none}:root:not([data-theme=light]) .lg-w{display:block}}
:root[data-theme=dark] .lg-b{display:none}:root[data-theme=dark] .lg-w{display:block}
.ncard{position:relative;background:light-dark(#fbf8f2,#1f1f19);border:1px solid var(--line);border-radius:22px;padding:18px 20px 22px;margin:18px 18px 26px 0;box-shadow:0 10px 26px rgba(40,35,20,.07)}
.ncard .nh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ncard .nh b{font-weight:600;font-size:15px;color:light-dark(#3d4030,#d9d6c6)}
.ncard .nh span{font-size:14px;color:var(--mut)}
.ncard p{margin:0;font-size:17px;line-height:1.45;padding-right:20px}
.ncard .nheart{position:absolute;right:-14px;bottom:-16px;width:46px;height:46px;border-radius:50%;border:3px solid var(--bg);background:#3d4030;color:#fbf8f2;display:grid;place-items:center;transition:transform .2s}
.ncard .nheart.on{background:#b4614c}.ncard .nheart:active{transform:scale(.92)}
.quote{display:flex;gap:8px;align-items:flex-start;margin:8px 0 18px;color:var(--mut);font-style:italic;font-size:15px;line-height:1.45}
.quote svg{flex:none;width:16px;height:16px;fill:var(--mut);margin-top:3px;opacity:.7}
.splash h1{font-weight:300;font-size:38px;line-height:1.1;margin:0 0 10px;letter-spacing:-.5px}
.cap{letter-spacing:.35em;text-transform:uppercase;font-size:11px;font-weight:400}
.splash .cap{opacity:.75;margin-bottom:14px}
.splash p{margin:0 0 30px;opacity:.8;font-size:15px}
.ob-btn{border:1px solid rgba(241,239,232,.6);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);color:#f1efe8;border-radius:999px;padding:13px 34px;min-height:50px;align-self:center}
.legal{font-size:11px;opacity:.55;margin-top:18px}
/* Onboarding */
.ob{padding:28px 24px 36px;min-height:100vh;display:flex;flex-direction:column}
.prog{display:flex;gap:6px;margin-bottom:34px}.prog i{flex:1;height:2px;border-radius:9px;background:var(--line)}.prog i.on{background:var(--ink)}
.ob h2,.pg h2{font-weight:300;font-size:30px;line-height:1.12;margin:0 0 8px;letter-spacing:-.4px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 22px;font-size:15px}
label.l{display:block;font-weight:400;font-size:13px;color:var(--mut);margin:16px 0 6px}
.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;font-size:16px;min-height:50px}
textarea.f{min-height:90px;resize:vertical}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 20px;margin-bottom:10px;min-height:58px}
.opt b{font-size:16px}.opt small{color:var(--mut);font-size:13px}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ob-nav{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;align-items:center}
.skip{border:0;background:none;color:var(--mut);min-height:44px}
.next,.btn{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:13px 26px;min-height:50px;font-weight:500}
.next:disabled{opacity:.25}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.w{width:100%}
/* Avatare */
.avs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.avb{flex:none;width:78px;height:78px;border-radius:22px;border:1px solid var(--line);background:var(--card);padding:6px;overflow:hidden;display:grid;place-items:center}
.avb img{border-radius:16px}
.av svg{padding:3px}
.avb.on{outline:2px solid var(--ink);outline-offset:2px}
.avb svg,.av svg{width:100%;height:100%}
.avb img,.av img{width:100%;height:100%;object-fit:cover}
.up{font-size:12px;color:var(--mut);text-align:center;line-height:1.2}
.file{position:absolute;width:1px;height:1px;opacity:0}
/* Home */
.pg{padding:20px 18px 120px}
.hi{display:flex;align-items:center;gap:14px}
.pack{margin-left:auto;display:flex;align-items:center}.pack .av.sm{width:34px;height:34px;margin-left:-8px;border:2px solid var(--bg);cursor:pointer;font-size:16px}.pack .av.sm:first-child{margin-left:0}.av.add{background:transparent!important;border:1.5px dashed var(--line,#c9c6bc)!important;color:inherit;font-size:18px;font-weight:300}
.dogs{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.dogi{display:flex;align-items:center;gap:12px}.dogi .av.sm{width:40px;height:40px;cursor:pointer}
.av{width:50px;height:50px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;font-weight:500;font-size:18px;overflow:hidden;border:0;padding:0}
.hi h1{font-weight:300;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.3px}
.hi .it{color:var(--mut);font-style:italic;font-size:17px;line-height:1.2}
.pills{display:flex;gap:8px;overflow-x:auto;margin:18px -18px 0;padding:0 18px 4px;scrollbar-width:none}
.pill{flex:none;border:0;background:var(--soft);border-radius:999px;padding:9px 18px;min-height:40px;font-size:14px;color:var(--mut)}
.pill.on{background:var(--ink);color:var(--bg)}
.stack{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -18px 0;padding:0 18px 10px;scrollbar-width:none}
.big{flex:none;width:80%;scroll-snap-align:center;border-radius:28px;overflow:hidden;position:relative;aspect-ratio:3/4;color:#fff;box-shadow:0 18px 34px rgba(20,20,10,.16);cursor:pointer}
.big.ev{aspect-ratio:4/5}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
svg.sc{position:absolute;inset:0;width:100%;height:100%}
.glass{position:absolute;left:10px;right:10px;bottom:10px;border-radius:22px;padding:14px 16px;background:rgba(25,25,18,.32);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12)}
.glass b{font-size:21px;line-height:1.15;display:block;font-weight:400;margin-top:2px}
.glass small{letter-spacing:.3em;text-transform:uppercase;font-size:10px;opacity:.75}
.rh{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#121210;display:grid;place-items:center;z-index:2}
.rh.on{background:#121210;color:#fff}
.datebadge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#121210;border-radius:16px;padding:6px 12px;text-align:center;line-height:1.1}
.datebadge b{display:block;font-size:20px}.datebadge small{font-size:11px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12px;margin-top:8px}
.st i{width:7px;height:7px;border-radius:50%}
.st.ok i{background:#9fc48b}.st.mid i{background:#e5bd6c}.st.no i{background:#e08a74}
h3.sec{font-weight:500;font-size:17px;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h3.sec span,h3.sec button{font-weight:300;color:var(--mut);font-size:13px;border:0;background:none;padding:0}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--card);border-radius:20px;padding:8px 16px 8px 8px;margin-bottom:8px}
.th{width:60px;height:60px;border-radius:14px;overflow:hidden;position:relative;display:block}
.row b{display:block;font-size:15px;line-height:1.25}
.row small{color:var(--mut);font-size:13px;display:block}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.badge{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut);margin-left:4px;vertical-align:1px;font-weight:400}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:-4px 0 12px}.legend span{display:flex;align-items:center;gap:6px}
.note{font-size:12px;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;min-height:42px;font-size:14px;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(20,20,10,.08)}
.post p{margin:0 0 14px;font-size:17px;line-height:1.65}.post{margin-top:16px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}
/* Nav */
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:412px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:9;box-shadow:0 10px 28px rgba(20,20,10,.12)}
nav button{border:0;background:none;height:50px;border-radius:999px;display:grid;place-items:center;color:var(--mut)}
nav button.on{background:var(--ink);color:var(--bg)}
nav svg{width:22px;height:22px}
/* Karte */
.mapv{padding:16px 14px 110px}
.mtop{display:flex;gap:8px;align-items:center}
.msearch{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:52px;box-shadow:0 6px 18px rgba(20,20,10,.08)}
.msearch input{border:0;background:none;outline:none;flex:1;font-size:16px;min-height:48px}
.fbtn{position:relative;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.fbtn i{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px}
.mapwrap{position:relative;margin-top:12px;border-radius:26px;overflow:hidden;height:calc(100vh - 260px);min-height:380px;background:var(--land);border:1px solid var(--line)}
.mapin{position:absolute;touch-action:none;transition:left .3s,top .3s,width .3s,height .3s}
.mapin>svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap{touch-action:none;user-select:none;-webkit-user-select:none}
.mlab{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:var(--mut);white-space:nowrap;pointer-events:none;font-weight:400}
.mlab.city{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.mlab.town::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mut);margin-right:4px;vertical-align:1px}
.mlab.lake,.mlab.river{font-style:italic;color:light-dark(#5f7d80,#8fb0b3)}
.mlab.peak{font-size:10px}.mlab.reg{letter-spacing:.3em;text-transform:uppercase;font-size:9px}
.mlab.country{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:light-dark(#b0aa9b,#5a574d)}
.mlab.hw{font-size:9px;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--road);border-radius:4px;padding:0 4px}
.zchips{position:absolute;left:10px;top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;right:10px;z-index:500}.zchips button{flex:none}
.zchips button{border:0;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:12px;min-height:32px;box-shadow:0 2px 8px rgba(20,20,10,.08)}
.zbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;background:var(--card);border-radius:16px;box-shadow:0 2px 8px rgba(20,20,10,.1);z-index:4;overflow:hidden}
.zbtns button{border:0;background:none;width:40px;height:40px;display:grid;place-items:center}.zbtns button+button{border-top:1px solid var(--line)}
.compass{position:absolute;right:16px;top:104px;width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:500;z-index:4;box-shadow:0 2px 8px rgba(20,20,10,.1)}
.mk{position:absolute;transform:translate(-50%,-50%);border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px 5px 9px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 3px 10px rgba(20,20,10,.18);min-height:30px;z-index:2}
.mk{position:relative;transform:translate(-50%,-50%)!important;justify-content:center;width:26px;height:26px;min-height:0;padding:0;cursor:pointer}.mk.on{transform:translate(-50%,-50%) scale(1.08)!important}
.mk.ml{transform:none!important}.mk.ml.on{transform:scale(1.08)!important}
.maplibregl-map{font-family:inherit;background:var(--land)}.maplibregl-ctrl-bottom-right{margin-bottom:96px}.maplibregl-ctrl-attrib{font-size:10px}.mk .dot{width:10px;height:10px}.mk .nm{display:none}.mk.on{width:auto;padding:5px 12px 5px 10px}.mk.on .nm{display:inline}
.mk.l{transform:translate(-12%,-50%)}.mk.r{transform:translate(-88%,-50%)}
.mk.on{background:var(--ink);color:var(--bg);z-index:3;transform:translate(-50%,-50%) scale(1.08)}
.mk.l.on{transform:translate(-12%,-50%) scale(1.08)}.mk.r.on{transform:translate(-88%,-50%) scale(1.08)}
.mk.cm{border:1px dashed var(--mut)}
.mcard{position:absolute;left:10px;right:10px;bottom:10px;z-index:500;display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:8px 12px 8px 8px;box-shadow:0 10px 26px rgba(20,20,10,.2);cursor:pointer}
.mcard .th{width:84px;height:84px;border-radius:16px}
.mcard b{display:block;font-size:16px}.mcard small{color:var(--mut);font-size:13px;display:block}
.xbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;align-self:start}
.count{text-align:center;font-size:13px;color:var(--mut);margin-top:10px}
/* Sheets */
.veil{position:fixed;inset:0;background:rgba(10,10,8,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;z-index:21;padding:10px 20px 28px;transition:transform .3s ease}
.sheet-open .veil{opacity:1;pointer-events:auto}.sheet-open .sheet{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-weight:400;font-size:22px;margin:0 0 4px}
.fgrp{border-bottom:1px solid var(--line);padding:16px 0}
.fgrp h4{margin:0 0 10px;font-weight:500;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:6px 0;text-align:left;min-height:48px}
.tg small{display:block;color:var(--mut);font-size:13px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on .sw{background:var(--ink)}.tg.on .sw::after{transform:translateX(20px)}
.sfoot{display:flex;justify-content:space-between;align-items:center;padding-top:16px;position:sticky;bottom:-28px;background:var(--bg);padding-bottom:6px}
.sfoot .skip{text-decoration:underline}
/* Detail */
.det{min-height:100vh;padding-bottom:40px}
.hero{position:relative;height:50vh;min-height:320px;color:#fff;overflow:hidden}
.back{position:absolute;top:16px;left:16px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(25,25,18,.3);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;z-index:2}
.tagtop{position:absolute;top:24px;right:16px;font-size:12px;background:rgba(25,25,18,.3);backdrop-filter:blur(10px);border-radius:999px;padding:6px 12px;z-index:2}
.photobtn{position:absolute;right:16px;bottom:50px;z-index:2;font-size:13px;color:#fff;background:rgba(25,25,18,.35);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;cursor:pointer}
.panel{background:var(--bg);border-radius:30px 30px 0 0;margin-top:-34px;position:relative;padding:26px 22px}
.panel h2{font-weight:400;font-style:italic;font-size:28px;line-height:1.1;margin:0}
.panel h2 span{font-style:normal;font-weight:300;font-size:16px;color:var(--mut)}
.hash{color:var(--mut);font-size:12px;margin:6px 0 14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.lk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;min-height:44px;font-size:14px;color:var(--ink);text-decoration:none}
.verdict{border-radius:20px;padding:16px 18px;margin:12px 0 8px;background:var(--card);font-size:14px;color:var(--mut)}
.verdict b{font-size:17px;display:flex;align-items:center;gap:10px;color:var(--ink);margin-bottom:2px}
.verdict b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok)}
.verdict.mid b::before{background:var(--mid)}.verdict.no b::before{background:var(--no)}
.rule{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rule .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;margin-top:2px}
.rule small{display:block;color:var(--mut);font-size:13px}
.box{background:var(--card);border-radius:20px;padding:16px 18px;margin:18px 0}
.box p{margin:0 0 12px}
.it{font-style:italic}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.ob2{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 18px;min-height:44px;font-size:14px}
.cta{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:999px;padding:8px 8px 8px 24px;margin-top:18px;border:1px solid var(--line)}
.cta div{flex:1}.cta b{display:block;font-style:italic;font-size:18px}.cta small{color:var(--mut);font-size:12px}
.cta button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:13px 22px;font-weight:500;min-height:50px}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ink)}
/* Community */
.ruleed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;margin-bottom:6px}
.ruleed .f{min-height:44px;padding:8px 10px;font-size:15px}
.minimap{position:relative;height:260px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--land);cursor:crosshair}
.minimap svg{position:absolute;inset:0;width:100%;height:100%}
.minimap .pinx{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.feed{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feed .av{width:40px;height:40px}
.feed small{color:var(--mut);font-size:13px}
/* Profil & Rechtliches */
.list{background:var(--card);border-radius:20px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;border-bottom:1px solid var(--line);padding:16px 18px;min-height:56px;text-align:left}
.li:last-child{border-bottom:0}
.li span{color:var(--mut)}
.legaltxt h3{font-weight:500;font-size:16px;margin:24px 0 6px}
.legaltxt p{margin:0 0 8px;color:var(--ink)}
.ph{background:var(--soft);border-radius:6px;padding:0 6px;color:var(--mut)}
.warn{background:var(--card);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--mut);margin:12px 0}
.tiles{columns:2;column-gap:10px}
.tile{display:block;width:100%;margin-bottom:10px;break-inside:avoid;position:relative;border:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;padding:0;background:none;color:#fff}
.tile:nth-child(3n+2){aspect-ratio:1}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.45));z-index:1}
.tile span{position:absolute;left:14px;bottom:12px;font-size:15px;font-weight:400;z-index:2}
.tile.on{outline:2px solid var(--ink);outline-offset:3px}
.tile.on::after{content:"✓";position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#fff;color:#121210;display:grid;place-items:center;font-size:14px;z-index:2}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .4s ease}@keyframes in{from{opacity:0}}}
@media (prefers-reduced-motion:reduce){#paws{display:none}.sheet,.veil{transition:none}}

 const seg=`<div class="seg"><button class="${S.ctab==="blog"?"on":""}" data-ct="blog">Berichte</button><button class="${S.ctab==="orte"?"on":""}" data-ct="orte">Orte melden & prüfen</button></div>`;
 if(S.ctab==="blog"){const ps=allPosts();return `<div class="pg screen"><h2 style="font-weight:300;font-size:30px;margin:4px 0 12px">Community</h2>${seg}

 <h3 class="sec">Von dir gemeldet</h3>${mineL.length?mineL.map(row).join(""):`<p class="note">Noch keine Orte gemeldet.</p>`}
 <h3 class="sec">Zuletzt aktiv</h3>
 <div class="feed"><span class="av">${breedSvg("dackel")}</span><span>Mia &amp; Luna haben <b>Café Flausch</b> bestätigt<small style="display:block">vor 3 Stunden</small></span></div>
 <div class="feed"><span class="av">${breedSvg("frenchie")}</span><span>Jonas &amp; Pepper haben die Regeln der <b>Kaser-Alm</b> aktualisiert<small style="display:block">gestern</small></span></div>
 <div class="feed"><span class="av">${breedSvg("golden")}</span><span>Lena &amp; Bruno haben <b>Hundestrand Ammersee-Süd</b> gemeldet<small style="display:block">vor 2 Tagen</small></span></div></div>`}
function addSheet(){const f=S.form;return `<div class="grab"></div><h2>Neuen Ort melden</h2><p class="note" style="font-size:14px;margin:0 0 6px">Nur Orte, die ihr selbst mit Hund besucht habt.</p>

function detail(){const p=allPlaces().find(x=>x.id===S.id);if(!p){S.view="main";return main()}const v=verdict(p,P),on=S.saved.includes(p.id),vote=S.votes[p.id];const pend=isPending(p);
 const route="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.n+(p.lat!=null?" "+p.a:""));

 <div class="verdict ${v}"><b>${v==="mid"?"Mit Einschränkung für":VTXT[v]+" für"} ${esc(P.dog)}</b>${v==="ok"?"Überall willkommen.":v==="mid"?"Nicht überall oder nur nach Anmeldung, schau dir die Details an.":"Hier leider nicht. Schau dir Alternativen an."}</div>
 ${p.r.map(r=>{const o=ok(r[1],P),c=o===1?"ok":o?"mid":"no";return `<div class="rule"><span class="ic" style="background:var(--${c})">${o===1?"✓":o?"!":"✕"}</span><div><b>${esc(r[0])}</b><small>${RT[r[1]]}${r[2]?" · "+esc(r[2]):""}</small></div></div>`}).join("")}

 <h3 class="sec">Berichte<button data-a="newpost">+ Bericht schreiben</button></h3>${allPosts().filter(b=>b.place===p.id).map(postRow).join("")||`<p class="note">Noch kein Bericht zu diesem Ort.</p>`}
 ${p.chk||p.src?`<div class="box"><p><b>Stimmt das noch?</b><br><span class="note">${p.chk?`Zuletzt bestätigt vor ${p.chk[0]} Tagen von ${p.chk[1]+(vote==="y"?1:0)} Hundebesitzern`:`Warst du mit Hund dort? Hilf anderen mit einer Bestätigung.`}</span></p>${vote?`<p class="it" style="margin:0">Danke, ${esc(P.owner)}! ${vote==="y"?"Bestätigt.":"Wir prüfen das."}</p>`:`<div class="btns"><button class="ob2" data-vote="y">Ja, stimmt</button><button class="ob2" data-vote="n">Nein, hat sich geändert</button></div>`}</div>`:""}
 <div class="cta"><div><b>${on?"Gemerkt":"Merken"}</b><small>für euren nächsten Ausflug</small></div><button data-save="${p.id}">${on?"♥ Gespeichert":"♡ Speichern"}</button></div></div></div>`}


// ================= Berichte (Blog) =================
const allPosts=()=>{if(DB.on){const done=DB.posts.some(b=>b.mine&&b.place===BLOG[0].place);return DB.posts.concat(done?[]:BLOG)}
 const mineP=S.posts;return mineP.filter(b=>!BLOG.some(x=>x.id===b.id)).reverse().concat(BLOG.map(b=>mineP.find(x=>x.id===b.id)||b))};
const placeOf=id=>allPlaces().find(p=>p.id===id);
const pawsTxt=n=>n?"🐾".repeat(n)+"<span style='opacity:.25'>"+"🐾".repeat(5-n)+"</span>":"";
const postImg=(b,cls="pic")=>b.img&&b.img[0]?`<img class="${cls}" src="${b.img[0]}" alt="">`:scene(placeOf(b.place)||{t:"hike"},"pb"+b.id);
function postCard(b){const pl=placeOf(b.place);return `<div class="big ev" data-post="${b.id}" role="button" tabindex="0">${postImg(b)}${b.draft?`<span class="datebadge" style="padding:6px 10px"><small>Entwurf</small></span>`:""}<div class="glass"><small>${esc(b.by)} · ${esc(b.date)}</small><b>${esc(b.title)}</b>${pl?`<span class="st">${esc(pl.n)}</span>`:""}</div></div>`}
function postRow(b){const pl=placeOf(b.place);return `<button class="row" data-post="${b.id}"><span class="th">${postImg(b)}</span><span><b>${esc(b.title)}${b.draft?'<span class="badge">Entwurf</span>':""}</b><small>${esc(b.by)}${pl?" · "+esc(pl.n):""}</small></span><span class="note">${esc(b.date)}</span></button>`}
function postView(){const b=allPosts().find(x=>x.id===S.pid);if(!b){S.view="main";return main()}const pl=placeOf(b.place);const mineB=b.mine||(!DB.on&&b.by===P.owner+" & "+P.dog)||b.id===1;
 return `<div class="det screen"><div class="hero" style="height:62vh">${postImg(b)}<button class="back" data-a="back" aria-label="Zurück">${I("back",22)}</button>${b.draft?`<span class="tagtop">Entwurf</span>`:""}</div>
 <div class="panel"><div class="hi" style="gap:10px"><span class="av" style="width:40px;height:40px">${b.photoBy?`<img src="${b.photoBy}" alt="">`:breedSvg(b.av||"mix")}</span><div><b>${esc(b.by)}</b><div class="note">${esc(b.date)}</div></div></div>
 <h2 style="margin-top:16px">${esc(b.title)}</h2>${b.paws?`<p style="margin:6px 0 0">${pawsTxt(b.paws)} <span class="note">Hundefreundlichkeit</span></p>`:""}
 <div class="post">${esc(b.text).split(/\n\n+/).map(t=>`<p>${t.replace(/\n/g,"<br>")}</p>`).join("")}</div>
 ${b.img&&b.img.length>1?`<div class="gal">${b.img.slice(1).map(u=>`<img src="${u}" alt="">`).join("")}</div>`:""}
 ${pl?`<h3 class="sec">Der Ort</h3>${row(pl)}`:""}
 ${mineB?`<button class="btn w" data-a="editpost" style="margin-top:14px">${b.draft?"Weiter schreiben":"Bericht bearbeiten"}</button>`:""}</div></div>`}
function postSheet(){const f=S.pf;const opts=allPlaces().slice().sort((a,b)=>a.n.localeCompare(b.n,"de"));
 return `<div class="grab"></div><h2>${f.id?"Bericht bearbeiten":"Neuer Bericht"}</h2><p class="note" style="font-size:14px;margin:0 0 6px">Erzähl anderen Hundebesitzern, wie es wirklich war.</p>
 <label class="l" for="bt">Titel</label><input class="f" id="bt" value="${esc(f.title)}" placeholder="z. B. Zur Kenzenhütte mit Nuki">
 <label class="l" for="bp">Ort</label><select class="f" id="bp"><option value="">Ohne Ort</option>${opts.map(p=>`<option value="${p.id}" ${f.place===p.id?"selected":""}>${esc(p.n)}</option>`).join("")}</select>
 <label class="l">Fotos</label><div class="avs">${(f.img||[]).map((u,i)=>`<span class="avb" style="position:relative"><img src="${u}" alt=""><button class="xbtn" style="position:absolute;top:2px;right:2px;width:24px;height:24px" data-delimg="${i}" aria-label="Foto entfernen">${I("x",12)}</button></span>`).join("")}<label class="avb" style="cursor:pointer" data-upload="post"><span class="up">${I("plus",20)}<br>Foto</span></label></div>
 <label class="l" for="bx">Dein Bericht</label><textarea class="f" id="bx" rows="10" style="min-height:220px">${esc(f.text)}</textarea>
 <label class="l">Wie hundefreundlich war's?</label><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${f.paws===n?"on":""}" data-paws="${n}">${n} 🐾</button>`).join("")}</div>
 <div class="sfoot"><button class="skip" data-a="savedraft">Als Entwurf speichern</button><button class="btn" data-a="publishpost">Veröffentlichen</button></div>`}
function keepPost(){const f=S.pf;if(!f||!$("bt"))return;f.title=$("bt").value;f.place=+$("bp").value||null;f.text=$("bx").value}
async function savePost(draft){keepPost();const f=S.pf;if(!f.title.trim())return toast("Bitte gib einen Titel ein");
 if(DB.on){try{toast("Wird gespeichert …");const imgs=[];for(const u of f.img||[])imgs.push(await upImg(u));
   const old=allPosts().find(x=>x.id===f.id);const row={place_id:f.place&&f.place>=100000?f.place-100000:null,title:f.title.trim(),body:f.text.trim(),images:imgs,paws:f.paws||0,draft:!!draft,author_name:P.owner+" & "+P.dog,author_avatar:P.avatar,updated_at:new Date().toISOString()};
   const q=old&&old.dbid?DB.sb.from("posts").update(row).eq("id",old.dbid).select().single():DB.sb.from("posts").insert(row).select().single();
   const {data,error}=await q;if(error)throw error;await dbLoad();closeSheet();S.pid=200000+data.id;go("post");toast(draft?"Entwurf gespeichert":"Bericht veröffentlicht")}
  catch(e){toast("Speichern fehlgeschlagen, bitte nochmal versuchen");console.warn(e)}return}
 const b={id:f.id||Date.now(),place:f.place,title:f.title.trim(),text:f.text.trim(),img:f.img||[],paws:f.paws||0,draft:draft?1:0,by:P.owner+" & "+P.dog,av:P.avatar,photoBy:P.photo,date:new Date().toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"})};
 S.posts=S.posts.filter(x=>x.id!==b.id).concat(b);if(!sv("nk4-posts",S.posts)){toast("Fotos zu groß, nur für diese Sitzung gespeichert")}else toast(draft?"Entwurf gespeichert":"Bericht veröffentlicht");
 closeSheet();S.pid=b.id;go("post")}

 <h3 class="sec">Aktivität</h3><div class="chips">${Object.entries(ACT).map(([k,v])=>`<button class="chip ${P.act===k?"on":""}" data-p="act:${k}">${v[0]}</button>`).join("")}</div>
 <p class="note" style="margin-top:22px">${DB.on?"● Verbunden mit der Nooks-Community. Orte, Berichte und Bestätigungen sehen alle.":DB.err?"○ Offline-Modus: Daten bleiben auf diesem Gerät. ("+esc(DB.err)+")":"○ Verbinde mit der Nooks-Community …"}</p>
 <h3 class="sec">Rechtliches</h3><div class="list"><button class="li" data-legal="impressum">Impressum<span>${I("chev",18)}</span></button><button class="li" data-legal="datenschutz">Datenschutz<span>${I("chev",18)}</span></button><button class="li" data-a="reset">Onboarding neu starten<span>${I("chev",18)}</span></button></div>
 <span style="display:block;width:max-content;margin:28px auto 6px;background:#045aff;border-radius:14px;padding:8px 14px"><img src="${LOGO_W}" alt="Nooks" style="height:26px;display:block"></span><p class="note" style="text-align:center;margin:0">Prototyp</p></div>`}
const ph=t=>`<span class="ph">${t}</span>`;
function legal(){const imp=S.legal==="impressum";return `<div class="pg screen legaltxt"><button class="xbtn" data-a="legalback" aria-label="Zurück" style="width:44px;height:44px">${I("back",20)}</button>
 <h2 style="margin-top:16px">${imp?"Impressum":"Datenschutz"}</h2><div class="warn">Vorlage mit Platzhaltern. Vor dem Launch mit echten Angaben füllen und rechtlich prüfen lassen. Das hier ist keine Rechtsberatung.</div>
 ${imp?`<h3>Angaben gemäß § 5 DDG</h3><p>${ph("Vor- und Nachname / Firma")}<br>${ph("Straße Hausnummer")}<br>${ph("PLZ Ort")}</p>
 <h3>Kontakt</h3><p>E-Mail: ${ph("hallo@…")}<br>Telefon: ${ph("optional")}</p>
 <h3>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h3><p>${ph("Name, Anschrift")}</p>
 <h3>Umsatzsteuer-ID</h3><p>${ph("falls vorhanden")}</p>
 <h3>Nutzerinhalte</h3><p>Orte, Regeln, Fotos und Bewertungen werden von der Community beigetragen. Wir prüfen Meldungen, können aber nicht für die Aktualität jeder Angabe garantieren. Hinweise auf falsche Angaben bitte an ${ph("E-Mail")}.</p>`
 :`<h3>1. Verantwortlicher</h3><p>${ph("Name, Anschrift, E-Mail")}</p>
 <h3>2. Welche Daten wir verarbeiten</h3><p>Profilangaben (dein Name, Name, Größe, Alter und Tragbarkeit deines Hundes, Interessen), Profilbild, gemerkte Orte, Event-Teilnahmen, von dir gemeldete Orte, Fotos und Bestätigungen sowie, nur mit deiner Zustimmung, deinen Standort.</p>
 <h3>3. Zweck und Rechtsgrundlage</h3><p>Personalisierte Anzeige, ob Orte für deinen Hund erlaubt sind; Bereitstellung der Community-Funktionen. Rechtsgrundlage: Art. 6 Abs. 1 lit. b DSGVO (Nutzungsvertrag) und lit. a (Einwilligung, z. B. Standort).</p>
 <h3>4. Dienstleister</h3><p>Datenbank und Foto-Speicher: Supabase (Server in London, Vereinigtes Königreich, für das die EU ein angemessenes Datenschutzniveau anerkennt), Kartendienst OpenFreeMap mit Daten von OpenStreetMap (beim Laden der Karte wird deine IP-Adresse an OpenFreeMap übermittelt), ${ph("App-Stores")}. Auftragsverarbeitungsverträge nach Art. 28 DSGVO.</p>
 <h3>5. Speicherdauer</h3><p>Solange dein Konto besteht. Nach Löschung des Kontos werden deine Daten ${ph("innerhalb von X Tagen")} gelöscht; öffentlich beigetragene Orte bleiben anonymisiert erhalten.</p>
 <h3>6. Deine Rechte</h3><p>Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch und Widerruf von Einwilligungen; Beschwerde bei einer Datenschutz-Aufsichtsbehörde, in Bayern z. B. dem ${ph("BayLDA")}.</p>
 <h3>7. Kontakt</h3><p>${ph("Datenschutz-E-Mail")}</p>
 <p class="note">Profil, gemerkte Orte und Event-Teilnahmen bleiben nur auf deinem Gerät. Gemeldete Orte, Berichte, Fotos und Bestätigungen werden in der Nooks-Datenbank gespeichert und sind für andere sichtbar; dabei wird eine anonyme Kennung deines Geräts verwendet.</p>`}</div>`}

// ================= Rendern =================
const NAV=[["home","home","Start"],["map","map","Karte"],["community","comm","Community"],["events","cal","Events"],["profile","user","Profil"]];
function main(){if(S.legal)return legal();return ({home,map:mapView,community,events,profile}[S.tab])()+`<nav>${NAV.map(([k,i,l])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}" aria-label="${l}">${I(i,22)}</button>`).join("")}</nav>`}
function render(){const h=S.view==="splash"?splash():S.view==="ob"?onboarding():S.view==="detail"?detail():S.view==="post"?postView():main();$("app").innerHTML=h;bindInputs();drawMap()}
function bindInputs(){const fo=$("fo"),fd=$("fd");if(fo){const u=()=>{S.draft.owner=fo.value;S.draft.dog=fd.value;document.querySelector(".next").disabled=!stepDone(0,S.draft)};fo.oninput=u;fd.oninput=u}
 const mq=$("mq");if(mq)mq.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("mq");n.focus();n.setSelectionRange(pos,pos)}}
const go=v=>{S.view=v;render();scrollTo(0,0)};
function openSheet(h){$("sheet").innerHTML=h;document.body.classList.add("sheet-open");bindSheet()}
function closeSheet(){document.body.classList.remove("sheet-open")}
function bindSheet(){const mm=$("mm");if(mm&&window.maplibregl){const f=S.form,ML=window.maplibregl;const m=new ML.Map({container:mm,style:MSTYLE,attributionControl:{compact:true},dragRotate:false,...(f.view?{center:f.view[0],zoom:f.view[1]}:{bounds:lb(REGIONS[0][1])})});m.touchZoomRotate.disableRotation();
 let pin=f.lat!=null?new ML.Marker({color:"#121210"}).setLngLat([f.lon,f.lat]).addTo(m):null;setTimeout(()=>m.resize(),350);
 m.on("click",e=>{f.lat=+e.lngLat.lat.toFixed(5);f.lon=+e.lngLat.lng.toFixed(5);hapt();if(pin)pin.setLngLat(e.lngLat);else pin=new ML.Marker({color:"#121210"}).setLngLat(e.lngLat).addTo(m)});m.on("moveend",()=>{f.view=[m.getCenter(),m.getZoom()]})}
 document.querySelectorAll("[data-ri]").forEach(s=>s.onchange=()=>{const[i,j]=s.dataset.ri.split(":");S.form.r[i][j]=s.value})}
function keepForm(){const f=S.form;if(!f||!$("pn"))return;f.n=$("pn").value;f.t=$("pt").value;f.a=$("pa").value;f.web=$("pw").value}

// Fotos verkleinern und speichern
let upTarget="";
function readImg(file){return new Promise(res=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.78))};im.onerror=()=>res(null);im.src=u})}
$("file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const d=await readImg(f);if(!d)return toast("Bild konnte nicht gelesen werden");
 if(upTarget==="oav"){S.draft.photo=d;render()}
 else if(upTarget==="pav"){P.photo=d;if(!sv("nk4-profile",P))toast("Foto nur für diese Sitzung");render()}
 else if(upTarget==="detail"){photos[S.id]=d;toast(sv("nk4-photos",photos)?"Foto gespeichert":"Foto nur für diese Sitzung");render()}
 else if(upTarget==="place"){keepForm();S.form.img=d;openSheet(addSheet())}
 else if(upTarget==="post"){keepPost();S.pf.img.push(d);openSheet(postSheet())}};

document.addEventListener("click",e=>{if(e.target.closest("button,[role=button],.chip,.pill,label.avb,.tg,.mk"))hapt();const t=e.target.closest("[data-a],[data-set],[data-p],[data-cat],[data-tab],[data-open],[data-save],[data-vote],[data-int],[data-pint],[data-sel],[data-mcat],[data-tg],[data-fc],[data-ev],[data-go],[data-evcat],[data-confirm],[data-legal],[data-upload],[data-oav],[data-pav],[data-delrule],[data-zoom],[data-post],[data-ct],[data-paws],[data-delimg]");if(!t)return;const d=t.dataset;
 if(d.upload){e.preventDefault();upTarget=d.upload;$("file").click();return}
 if(d.save){e.stopPropagation();const id=+d.save;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):S.saved.concat(id);sv("nk4-saved",S.saved);toast(S.saved.includes(id)?"Gemerkt ♥":"Entfernt");render();return}
 if(d.open){e.stopPropagation();closeSheet();S.id=+d.open;go("detail");return}
 if(d.post){e.stopPropagation();closeSheet();S.pid=+d.post;go("post");return}
 if(d.ct&&!d.tab){S.ctab=d.ct;render();return}
 if(d.paws){keepPost();S.pf.paws=+d.paws;openSheet(postSheet());return}
 if(d.delimg){keepPost();S.pf.img.splice(+d.delimg,1);openSheet(postSheet());return}
 if(d.zoom){if(LM)LM.fitBounds(lb(REGIONS[+d.zoom][1]),{padding:20,duration:800});return}
 if(d.sel){S.sel=S.sel===+d.sel?0:+d.sel;render();return}
 if(d.mcat){S.F.cats=d.mcat==="all"?[]:[d.mcat];S.sel=0;render();return}
 if(d.tg){S.T[d.tg]=!S.T[d.tg];openSheet(filterSheet());return}
 if(d.fc){const[k,v]=d.fc.split(":");S.T[k]=S.T[k].includes(v)?S.T[k].filter(x=>x!==v):S.T[k].concat(v);openSheet(filterSheet());return}
 if(d.ev){const ev=EVENTS.find(x=>x.id===+d.ev);openSheet(eventSheet(ev));return}
 if(d.go){const id=+d.go;S.going=S.going.includes(id)?S.going.filter(x=>x!==id):S.going.concat(id);sv("nk4-going",S.going);openSheet(eventSheet(EVENTS.find(x=>x.id===id)));render();toast(S.going.includes(id)?"Ihr seid dabei!":"Abgemeldet");return}
 if(d.evcat){S.evcat=d.evcat;render();return}
 if(d.confirm){const p=allPlaces().find(x=>x.id===+d.confirm);S.confirms[d.confirm]=1;sv("nk4-conf",S.confirms);
  if(DB.on&&p&&p.db)DB.sb.from("confirmations").upsert({place_id:p.dbid,vote:"y"},{onConflict:"place_id,user_id"}).then(({error})=>{if(error)toast("Konnte nicht speichern");else dbLoad().then(render)});
  toast("Danke fürs Bestätigen!");render();return}
 if(d.legal){S.legal=d.legal;render();scrollTo(0,0);return}
 if(d.oav){S.draft.avatar=d.oav;S.draft.photo="";render();return}
 if(d.pav){P.avatar=d.pav;P.photo="";sv("nk4-profile",P);render();return}
 if(d.delrule){keepForm();S.form.r.splice(+d.delrule,1);openSheet(addSheet());return}
 if(d.set){const[k,v]=d.set.split(":");S.draft[k]=v;render();return}
 if(d.int){const k=d.int,a=S.draft.int;S.draft.int=a.includes(k)?a.filter(x=>x!==k):a.concat(k);render();return}
 if(d.p){const[k,v]=d.p.split(":");P[k]=v;sv("nk4-profile",P);render();toast("Profil aktualisiert");return}
 if(d.pint){const k=d.pint;P.int=P.int.includes(k)?P.int.filter(x=>x!==k):P.int.concat(k);sv("nk4-profile",P);render();return}
 if(d.cat){S.cat=d.cat;render();return}
 if(d.tab){if(d.ct)S.ctab=d.ct;S.tab=d.tab;S.legal="";S.sel=0;go("main");return}
 if(d.vote){S.votes[S.id]=d.vote;sv("nk4-votes",S.votes);const p=allPlaces().find(x=>x.id===S.id);
  if(DB.on&&p&&p.db)DB.sb.from("confirmations").upsert({place_id:p.dbid,vote:d.vote},{onConflict:"place_id,user_id"}).then(({error})=>{if(error)toast("Konnte nicht speichern");else dbLoad().then(render)});
  render();return}
 const a=d.a;
 if(a==="start")go("ob");
 if(a==="skip"){P={owner:"Alicia",dog:"Nuki",size:"L",carry:"N",age:"A",int:["huette","hike","cafe"],avatar:"samojede",photo:""};sv("nk4-profile",P);S.tab="home";go("main")}
 if(a==="prev"){S.step--;if(S.adding&&S.step===3)S.step--;render()}
 if(a==="adddog"){S.adding=true;S.step=0;S.draft={owner:P.owner,int:P.int||[],dog:"",size:"",carry:"",age:"",act:"",avatar:"",photo:""};go("ob");return}
 if(a==="canceldog"){S.adding=false;S.tab="home";go("main");return}
 if(a==="dogsw"){const i=+t.dataset.i,nx=pack()[i];if(!nx)return;const pk=pack().slice();pk[i]=dogOf(P);P={...P,...nx,pack:pk};saveP();render();toast("Jetzt unterwegs mit "+P.dog);return}
 if(a==="dogdel"){const i=+t.dataset.i;const pk=pack().slice();const x=pk.splice(i,1)[0];P={...P,pack:pk};saveP();render();toast((x?x.dog:"Hund")+" entfernt");return}
 if(a==="next"){if(S.step<LAST){S.step++;if(S.adding&&S.step===3)S.step++;render()}else if(S.adding){const nd=dogOf({...S.draft,dog:S.draft.dog.trim()});P={...P,...nd,pack:pack().concat([dogOf(P)])};S.adding=false;saveP();S.tab="home";go("main");toast(nd.dog+" ist jetzt dabei")}else{P={...S.draft,owner:S.draft.owner.trim(),dog:S.draft.dog.trim()};if(!sv("nk4-profile",P)){P.photo&&sv("nk4-profile",{...P,photo:""})}S.tab="home";go("main")}}
 if(a==="back")go("main");
 if(a==="reset"){S.step=0;S.draft={int:[],...P};go("ob")}
 if(a==="filter"){S.T=JSON.parse(JSON.stringify(S.F));openSheet(filterSheet())}
 if(a==="fclear"){S.T={cats:[],fit:false,indoor:false,stay:false,free:false,reg:[]};openSheet(filterSheet())}
 if(a==="fapply"){S.F=S.T;S.sel=0;closeSheet();render()}
 if(a==="unsel"){e.stopPropagation();S.sel=0;render()}
 if(a==="legalback"){S.legal="";render()}
 if(a==="demolink")toast("Beispielort, der echte Link kommt mit den echten Daten");
 if(a==="addplace"){S.form={n:"",t:"huette",a:"",x:null,y:null,r:[["Terrasse","Y"]],web:"",img:""};openSheet(addSheet())}
 if(a==="addrule"){keepForm();S.form.r.push(["Innenraum","Y"]);openSheet(addSheet())}
 if(a==="closesheet")closeSheet();
 if(a==="likeq"){S.qlike=S.qlike===dayKey()?"":dayKey();sv("nk4-qlike",S.qlike);render()}
 if(a==="newpost"){S.pf={id:0,title:"",place:S.view==="detail"?S.id:null,text:"",img:[],paws:0};openSheet(postSheet())}
 if(a==="editpost"){const b=allPosts().find(x=>x.id===S.pid);S.pf={id:b.id,title:b.title,place:b.place,text:b.id===1&&b.draft&&!S.posts.some(x=>x.id===1)?"":b.text,img:[...(b.img||[])],paws:b.paws||0};openSheet(postSheet())}
 if(a==="savedraft")savePost(1);
 if(a==="publishpost")savePost(0);
 if(a==="submitplace"){keepForm();const f=S.form;if(!f.n.trim()||!f.a.trim())return toast("Bitte Name und Gegend angeben");if(f.lat==null)return toast("Bitte tippe auf die Karte");
  const reg=f.lat>48&&f.lon>11.3&&f.lon<11.85?"muc":f.lat>47.55&&f.lon<13?"de":f.lon<9.6?"ch":f.lat<46.95&&f.lon>10.5?"it":"at";
  if(DB.on){(async()=>{try{toast("Wird gesendet …");const photo=f.img?await upImg(f.img):null;const web=/^https?:\/\//.test(f.web.trim())?f.web.trim():null;
    const {error}=await DB.sb.from("places").insert({name:f.n.trim(),cat:f.t,area:f.a.trim(),region:reg,lat:f.lat,lon:f.lon,rules:f.r.map(r=>[r[0],r[1]]),web,photo_url:photo,author_name:P.owner+" & "+P.dog,author_avatar:P.avatar});
    if(error)throw error;await dbLoad();closeSheet();S.tab="community";S.ctab="orte";render();toast("Danke! Der Ort wird jetzt geprüft.")}catch(e){console.warn(e);toast("Senden fehlgeschlagen, bitte nochmal versuchen")}})();return}
  const id=Date.now();const np={id,n:f.n.trim(),t:f.t,a:f.a.trim(),reg:f.lat>48&&f.lon>11.3&&f.lon<11.85?"muc":f.lat>47.55&&f.lon<13?"de":f.lon<9.6?"ch":f.lat<46.95&&f.lon>10.5?"it":"at",lat:f.lat,lon:f.lon,x:px(f.lon),y:py(f.lat),r:f.r.map(r=>[r[0],r[1]]),web:f.web.trim(),by:P.owner+" & "+P.dog,ab:P.avatar,photoBy:P.photo,ago:"gerade eben",need:5,have:0};
  if(f.img)photos[id]=f.img;S.community.push(np);sv("nk4-comm",S.community);sv("nk4-photos",photos);closeSheet();S.tab="community";render();toast("Danke! Der Ort wird jetzt geprüft.")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.dataset?.open){S.id=+e.target.dataset.open;go("detail")}});
$("veil").onclick=closeSheet;
render();dbInit();
}
</script>
</body>
</html>
